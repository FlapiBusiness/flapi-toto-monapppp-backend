apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-toto-MonApppp-backend-deployment
  namespace: dev-toto-MonApppp-backend
  labels:
    app: dev-toto-MonApppp-backend
spec:
  selector:
    matchLabels:
      app: dev-toto-MonApppp-backend
  template:
    metadata:
      labels:
        app: dev-toto-MonApppp-backend
    spec:
      containers:
        - name: dev-toto-MonApppp-backend
          image: corentin35/toto-MonApppp-backend:develop-${TAG_VERSION}
          imagePullPolicy: Always
          ports:
            - containerPort: 3333
          env:
            - name: PORT
              value: '3333'
          resources:
            requests:
              cpu: '300m'
              memory: '400Mi'
            limits:
              cpu: '600m'
              memory: '800Mi'
      imagePullSecrets:
        - name: regcred
